# models
models_phase1: ["qwen2.5-coder:1.5b", "deepseek-coder:1.3b", "llama3.2:1b", "qwen2.5-coder:0.5b"]
models_phase2: ["llama3.2:3b", "qwen2.5:3b", "gemma3:4b", "phi4-mini-reasoning"]

# temperatures
temperature_phase1: 0.0    # deterministic extraction (greedy decoding)
temperature_phase2: 0.6    # allow response variability

repetitions_latency: 30       # more repetitions to estimate latency reliably

# seed
seed: 42

# paths
paths:
  questions: "benchmark/dataset/questions.jsonl"
  mock_data: "benchmark/dataset/mock_data"
  runs: "benchmark/runs"
