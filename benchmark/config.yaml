#models
models_phase1: ["qwen2.5-coder:1.5b", "deepseek-coder:1.3b", "llama3.2:1b", "qwen2.5-coder:0.5b"]
models_phase2: ["llama3.2:3b", "qwen2.5:3b", "gemma3:4b", "phi4-mini:3.8b"]

#temperatures
temperature_phase1: 0.0
temperature_phase2: 0.6

seed: 42
repetitions_latency: 30
repetitions_phase3: 20

#max tokens generated per call
num_predict: 512
#disables the repetition penalty
repeat_penalty: 1.0 

#paths
paths:
  questions: "benchmark/dataset/questions_99.jsonl"
  answers: "benchmark/dataset/answers/ideal_answers.jsonl"
  answers_phase3: "benchmark/dataset/answers/ideal_answers_99.jsonl"
  mock_data: "benchmark/dataset/mock_data"
  runs: "benchmark/runs"
  results: "benchmark/results"
